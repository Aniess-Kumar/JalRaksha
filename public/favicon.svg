<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="favShieldGrad" x1="10" y1="0" x2="90" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#22d3ee" />
      <stop offset="50%" stopColor="#0284c7" />
      <stop offset="100%" stopColor="#1e3a8a" />
    </linearGradient>
    <linearGradient id="favShieldBacking" x1="50" y1="0" x2="50" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#031525" />
      <stop offset="100%" stopColor="#020b14" />
    </linearGradient>
    <linearGradient id="favDropGrad" x1="50" y1="20" x2="50" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#e0f2fe" />
      <stop offset="35%" stopColor="#38bdf8" />
      <stop offset="100%" stopColor="#0284c7" />
    </linearGradient>
  </defs>
  <!-- Outer Shield Frame -->
  <path d="M 50,6 L 86,22 C 86,56 70,82 50,94 C 30,82 14,56 14,22 Z" fill="url(#favShieldBacking)" stroke="url(#favShieldGrad)" stroke-width="4" stroke-linejoin="round" />
  <!-- Radar Wave Arcs -->
  <path d="M 26,38 A 28 28 0 0 1 74,38" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="3 2" stroke-linecap="round" opacity="0.85" />
  <!-- Central Crystal Water Drop -->
  <path d="M 50,22 C 50,22 68,44 68,59 C 68,69.5 59.9,78 50,78 C 40.1,78 32,69.5 32,59 C 32,44 50,22 50,22 Z" fill="url(#favDropGrad)" stroke="#e0f2fe" stroke-width="1.5" />
  <!-- Golden Telemetry Indicator -->
  <circle cx="50" cy="62" r="4" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5" />
</svg>
